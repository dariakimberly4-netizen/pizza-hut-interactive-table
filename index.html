<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Hut Interactive Table — Concept</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100806;color:#fff;font-family:Inter,Arial,sans-serif}body{overflow-x:hidden}
.scene{min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:24px 18px 34px;background:radial-gradient(ellipse at 50% 0%,rgba(239,143,66,.22),transparent 34%),linear-gradient(#120b08 0 18%,#26140d 19%,#120806 100%)}
.scene:before{content:"";position:absolute;inset:18% -8% -10%;background:linear-gradient(90deg,rgba(255,255,255,.018),transparent 12%,rgba(0,0,0,.16) 13%,transparent 14%),repeating-linear-gradient(91deg,transparent 0 118px,rgba(255,255,255,.018) 119px 120px);transform:perspective(900px) rotateX(6deg);transform-origin:top;pointer-events:none}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,transparent 20%,rgba(0,0,0,.55) 82%);pointer-events:none}
.brand{z-index:2;text-align:center;opacity:.82}.brand b{font-size:clamp(19px,3vw,29px);letter-spacing:.08em}.brand b span{color:#e31837}.brand small{display:block;color:#a99388;margin-top:5px;font-size:9px;letter-spacing:.22em}
.cartBtn{position:absolute;right:18px;top:18px;z-index:5;border:1px solid #ffffff24;background:#160d09cc;color:#fff;border-radius:999px;min-height:44px;padding:0 17px;font-weight:800;cursor:pointer}
.stage{z-index:2;width:min(920px,100%);flex:1;display:grid;place-items:center;position:relative;padding:24px 0 8px}
.food{position:relative;width:min(76vw,620px);height:min(58vh,520px);display:grid;place-items:center;cursor:zoom-in;transition:.28s ease}
.food:after{content:"";position:absolute;width:70%;height:12%;bottom:7%;border-radius:50%;background:#000b;filter:blur(22px);z-index:-1}
.food img{width:100%;height:100%;object-fit:contain;border-radius:0;filter:drop-shadow(0 34px 26px #000b) saturate(1.08);transition:.3s ease}
.food.swap img{transform:scale(.92);opacity:0}
.card{position:absolute;left:4%;top:13%;z-index:4;width:min(285px,35vw);padding:16px 17px;background:rgba(22,13,9,.48);border:1px solid #ffffff20;border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 14px 40px #0005;transform:rotate(-1deg)}
.eyebrow{font-size:9px;letter-spacing:.2em;color:#efb9a8}.card h1{font-size:clamp(20px,3vw,34px);line-height:1;margin:7px 0}.desc{color:#cdbdb5;line-height:1.4;font-size:12px}.price{font-size:24px;font-weight:900;margin-top:9px}
.controls{z-index:3;display:flex;gap:clamp(18px,5vw,50px);justify-content:center;align-items:flex-start;margin-top:2px}
.controlUnit{text-align:center;color:#9d8980;font-size:8px;letter-spacing:.16em;font-weight:800}.controls button{width:76px;height:76px;border-radius:50%;border:1px solid #ffffff2b;background:radial-gradient(circle at 35% 28%,#39231b,#160c08 65%);box-shadow:inset 0 1px 1px #ffffff24,0 9px 22px #0009;color:#fff;font-size:19px;cursor:pointer;display:grid;place-items:center;margin-bottom:7px}.controls button:active{transform:translateY(2px);box-shadow:inset 0 4px 10px #000b}.controls .primary{border-color:#e3183770;box-shadow:inset 0 1px 1px #ffffff24,0 0 0 2px #e3183718,0 9px 22px #0009}
.orderAction{z-index:3;margin-top:18px;border:0;border-radius:999px;background:#e31837;color:#fff;padding:14px 27px;font-weight:900;letter-spacing:.08em;cursor:pointer;box-shadow:0 10px 28px #e3183730}
.dots{z-index:3;display:flex;gap:7px;margin-top:14px}.dot{width:5px;height:5px;border-radius:50%;background:#6d554c}.dot.on{background:#fff}
.notice{z-index:2;color:#725f57;font-size:9px;margin-top:14px;text-align:center}
.modalWrap{position:fixed;inset:0;background:#000c;z-index:30;display:none;place-items:center;padding:18px}.modalWrap.open{display:grid}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#21130f;border:1px solid #ffffff25;border-radius:24px;padding:25px}.modal h2{margin:0 0 8px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.choice{border:1px solid #ffffff2b;padding:10px 13px;border-radius:12px;cursor:pointer}.choice.selected{border-color:#e31837;background:#e3183720}.qty{display:flex;align-items:center;gap:16px}.modal button{min-height:48px;border-radius:999px;border:1px solid #ffffff30;background:#20130f;color:white;padding:0 20px;font-weight:750;cursor:pointer}.modal .primary{background:#e31837;border-color:#e31837}.qty button{width:46px;padding:0}.close{float:right}.cartList{display:grid;gap:10px;margin:16px 0}.cartItem{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff1f;padding-bottom:10px}.total{font-size:22px;font-weight:800}
.imageViewer{position:fixed;inset:0;background:rgba(7,3,2,.96);z-index:50;display:none;place-items:center;padding:3vw;cursor:zoom-out}.imageViewer.open{display:grid}.imageViewer img{width:min(96vw,1200px);height:min(94vh,900px);object-fit:contain;filter:drop-shadow(0 35px 45px #000)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#15100d;padding:11px 17px;border-radius:999px;z-index:60;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.scene{padding:18px 12px 28px}.cartBtn{top:15px;right:12px;font-size:11px;min-height:39px}.brand{padding-top:5px}.stage{padding:8px 0 0;min-height:57vh}.food{width:94vw;height:48vh}.card{left:4%;top:7%;width:190px;padding:11px 12px;border-radius:13px}.card h1{font-size:20px}.card .desc{display:none}.price{font-size:20px}.controls{gap:23px}.controls button{width:67px;height:67px}.orderAction{margin-top:14px}.notice{max-width:85%;line-height:1.35}}
</style></head>
<body>
<main class="scene">
<button class="cartBtn" id="cartBtn">ORDER · <span id="count">0</span></button>
<div class="brand"><b>PIZZA <span>HUT</span></b><small>INTERACTIVE TABLE · CONCEPT</small></div>

<section class="stage">
<article class="card"><div class="eyebrow" id="cat"></div><h1 id="name"></h1><div class="desc" id="desc"></div><div class="price" id="price"></div></article>
<div class="food" id="food" role="button" tabindex="0" aria-label="Enlarge featured food"><img id="img" alt=""></div>
</section>
<nav class="controls" aria-label="Menu controls"><div class="controlUnit"><button id="prev" aria-label="Previous">◀</button>PREVIOUS</div><div class="controlUnit"><button id="play" class="primary" aria-label="Pause">Ⅱ</button><span id="playLabel">PAUSE</span></div><div class="controlUnit"><button id="next" aria-label="Next">▶</button>NEXT</div></nav><button class="orderAction" id="customize">CUSTOMIZE · ORDER</button>
<div class="dots" id="dots"></div>
<div class="notice">Unofficial interactive ordering concept · Demo only · Not affiliated with or operated by Pizza Hut.</div>
</main>
<div class="modalWrap" id="detail"><div class="modal"><button class="close" data-close="detail">✕</button><div class="eyebrow">CUSTOMIZE ORDER</div><h2 id="mName"></h2><p id="mDesc" class="desc"></p><strong>Size</strong><div class="row" id="sizes"></div><strong>Quantity</strong><div class="qty"><button id="minus">−</button><b id="qty">1</b><button id="plus">+</button></div><div class="row"><button class="primary" id="add">ADD TO ORDER</button><button data-close="detail">CANCEL</button></div></div></div>
<div class="modalWrap" id="cart"><div class="modal"><button class="close" data-close="cart">✕</button><div class="eyebrow">YOUR TABLE ORDER</div><h2>Order Summary</h2><div class="cartList" id="cartList"></div><div class="total" id="total"></div><div class="row"><button class="primary" id="checkout">DEMO CHECKOUT</button><button data-close="cart">CONTINUE BROWSING</button></div></div></div>
<div class="imageViewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Enlarged food image"><img id="bigImg" alt=""></div><div class="toast" id="toast"></div>
<script>
const items=[
{name:"Pepperoni Supreme",cat:"PIZZA",price:549,desc:"A loaded pepperoni pizza concept with melted cheese and a crisp golden crust.",img:"https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Large","Family"]},
{name:"Cheese Lovers",cat:"PIZZA",price:499,desc:"Rich, melty cheese over a classic tomato base for a simple crowd favorite.",img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Large","Family"]},
{name:"Creamy Pasta",cat:"PASTA",price:229,desc:"Comforting creamy pasta served warm for the table.",img:"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=85",sizes:["Solo","Sharing"]},
{name:"Crispy Chicken",cat:"CHICKEN",price:349,desc:"Crispy, savory chicken made for sharing alongside pizza.",img:"https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=900&q=85",sizes:["4 pcs","6 pcs","8 pcs"]},
{name:"Garlic Bread",cat:"SIDES",price:169,desc:"Toasty garlic bread with a buttery finish.",img:"https://images.unsplash.com/photo-1573140401552-3fab0b24306f?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Sharing"]},
{name:"Chocolate Dessert",cat:"DESSERT",price:199,desc:"A rich chocolate finish to your table order.",img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85",sizes:["Solo","Sharing"]}
];
let i=0,playing=true,timer,qty=1,size="",cart=[];
const $=id=>document.getElementById(id);
function render(){
 const x=items[i]; $("name").textContent=x.name;$("cat").textContent=x.cat+" · FEATURED";$("desc").textContent=x.desc;$("price").textContent="₱"+x.price.toLocaleString();$("img").src=x.img;$("img").alt=x.name;
 $("dots").innerHTML=items.map((_,n)=>'<span class="dot '+(n===i?'on':'')+'"></span>').join("");
}
function move(d){$("food").classList.add("swap");setTimeout(()=>{i=(i+d+items.length)%items.length;render();$("food").classList.remove("swap")},220)}
function restart(){clearInterval(timer);if(playing)timer=setInterval(()=>move(1),4500)}
$("prev").onclick=()=>{move(-1);restart()};$("next").onclick=()=>{move(1);restart()};
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Ⅱ":"▶";$("playLabel").textContent=playing?"PAUSE":"PLAY";restart()};
function openImage(){const x=items[i];$("bigImg").src=x.img;$("bigImg").alt=x.name;$("imageViewer").classList.add("open");clearInterval(timer)}
$("imageViewer").onclick=()=>{$("imageViewer").classList.remove("open");restart()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("imageViewer").classList.contains("open")){$("imageViewer").classList.remove("open");restart()}});
$("customize").onclick=openDetail;
function openDetail(){const x=items[i];qty=1;size=x.sizes[0];$("mName").textContent=x.name;$("mDesc").textContent=x.desc;$("qty").textContent=qty;$("sizes").innerHTML=x.sizes.map((s,n)=>'<span class="choice '+(!n?'selected':'')+'" data-size="'+s+'">'+s+'</span>').join("");$("detail").classList.add("open")}
$("food").onclick=e=>{e.stopPropagation();openImage()};$("food").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();openImage()}};
$("sizes").onclick=e=>{if(!e.target.dataset.size)return;size=e.target.dataset.size;[...$("sizes").children].forEach(x=>x.classList.toggle("selected",x===e.target))};
$("minus").onclick=()=>{$("qty").textContent=qty=Math.max(1,qty-1)};$("plus").onclick=()=>{$("qty").textContent=qty=Math.min(20,qty+1)};
$("add").onclick=()=>{cart.push({...items[i],qty,size});$("count").textContent=cart.reduce((a,x)=>a+x.qty,0);$("detail").classList.remove("open");toast("Added to your table order");renderCart()};
function renderCart(){if(!cart.length){$("cartList").innerHTML='<p class="desc">Your order is empty.</p>';$("total").textContent="Total · ₱0";return} $("cartList").innerHTML=cart.map(x=>'<div class="cartItem"><span>'+x.qty+'× '+x.name+'<br><small>'+x.size+'</small></span><b>₱'+(x.price*x.qty).toLocaleString()+'</b></div>').join("");$("total").textContent="Total · ₱"+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString()}
$("cartBtn").onclick=()=>{renderCart();$("cart").classList.add("open")};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("open"));
$("checkout").onclick=()=>{if(!cart.length){toast("Add an item first");return}cart=[];$("count").textContent="0";$("cart").classList.remove("open");toast("Demo order complete — thank you!")};
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
render();restart();
</script></body></html>
