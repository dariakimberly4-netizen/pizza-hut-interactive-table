<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza Hut Interactive Table — Concept</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100805;color:#fff;font-family:Inter,Arial,sans-serif}body{overflow-x:hidden}
.scene{min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:22px 14px 30px;background:linear-gradient(#100906 0 14%,#211108 14.2%,#2c160b 100%)}
.scene:before{content:"";position:absolute;inset:14% -12% -12%;background:radial-gradient(ellipse at 50% 24%,rgba(255,178,91,.19),transparent 38%),repeating-linear-gradient(92deg,rgba(255,255,255,.012) 0 2px,transparent 2px 86px),repeating-linear-gradient(2deg,rgba(0,0,0,.08) 0 1px,transparent 1px 38px);transform:perspective(900px) rotateX(5deg);transform-origin:top;pointer-events:none}
.scene:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 47%,transparent 15%,rgba(0,0,0,.5) 88%);pointer-events:none}
.brand{z-index:3;position:absolute;left:20px;top:20px;opacity:.28;transform:rotate(-1deg)}.brand b{font-size:11px;letter-spacing:.18em;text-shadow:0 1px #000}.brand b span{color:#b88778}.brand small{display:none}
.cartBtn{position:absolute;right:14px;top:14px;z-index:6;border:1px solid #ffffff18;background:#140b08a8;color:#d9cbc4;border-radius:999px;min-height:38px;padding:0 14px;font-size:10px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.stage{z-index:2;width:min(1000px,100%);flex:1;display:grid;place-items:center;position:relative;padding:10px 0 0}
.card{position:absolute;z-index:4;top:9%;right:5%;width:240px;text-align:left;pointer-events:none;padding:12px 14px;border-left:1px solid rgba(255,225,200,.22);background:linear-gradient(90deg,rgba(255,210,175,.035),transparent)}.eyebrow{font-size:9px;letter-spacing:.24em;color:#c8aaa0}.card h1{font-size:clamp(19px,3vw,30px);line-height:1;margin:6px 0 5px;color:#d9bcae;text-shadow:0 1px #000,0 0 14px rgba(255,184,140,.12)}.card .desc{display:none}.price{font-size:clamp(18px,3vw,27px);font-weight:850;color:#f1ddd3;margin-top:0}
.food{position:relative;width:min(88vw,760px);height:min(65vh,620px);display:grid;place-items:center;cursor:zoom-in;margin-top:35px;transition:.3s ease}
.food:after{content:"";position:absolute;width:68%;height:10%;bottom:10%;border-radius:50%;background:#000c;filter:blur(25px);z-index:-1;transition:.3s ease}
.food img{width:100%;height:100%;object-fit:contain;clip-path:ellipse(48% 45% at 50% 50%);filter:drop-shadow(0 30px 25px #000d) saturate(1.12) contrast(1.05);transform:perspective(850px) rotateX(7deg);transition:transform .36s cubic-bezier(.2,.8,.2,1),opacity .25s}
.food.swap img{transform:perspective(850px) rotateX(7deg) scale(.88) translateY(8px);opacity:0}.food.swap:after{opacity:.2;transform:scale(.8)}
.controls{z-index:4;display:flex;gap:clamp(25px,7vw,72px);justify-content:center;align-items:flex-start;margin-top:-4px}
.controlUnit{text-align:center;color:#8e756a;font-size:8px;letter-spacing:.19em;font-weight:800}.controls button{width:72px;height:72px;border-radius:50%;border:1px solid #8b5b4438;background:radial-gradient(circle at 40% 30%,rgba(102,63,45,.22),rgba(18,9,6,.55) 62%);box-shadow:inset 0 2px 5px #ffffff0c,inset 0 -6px 12px #0007,0 7px 13px #0006;color:#d9c8bf;font-size:18px;cursor:pointer;display:grid;place-items:center;margin-bottom:8px;transition:.12s}
.controls button:active{transform:translateY(3px) scale(.96);box-shadow:inset 0 5px 12px #000c,0 0 18px #e3183730}.controls .primary{border-color:#e3183748;color:#fff}
.orderAction{z-index:4;margin-top:18px;border:1px solid rgba(227,24,55,.32);border-radius:50%;width:64px;height:64px;background:radial-gradient(circle at 38% 30%,rgba(227,24,55,.35),rgba(65,12,14,.35) 62%);color:#e7c9c2;padding:0;font-size:9px;font-weight:900;letter-spacing:.11em;cursor:pointer;box-shadow:inset 0 2px 5px #ffffff0c,inset 0 -6px 12px #0008,0 7px 14px #0006}
.dots{display:none}
.notice{display:none}
.modalWrap{position:fixed;inset:0;background:#000d;z-index:30;display:none;place-items:center;padding:18px}.modalWrap.open{display:grid}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#21130f;border:1px solid #ffffff25;border-radius:24px;padding:25px}.modal h2{margin:0 0 8px}.desc{color:#cdbdb5;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.choice{border:1px solid #ffffff2b;padding:10px 13px;border-radius:12px;cursor:pointer}.choice.selected{border-color:#e31837;background:#e3183720}.qty{display:flex;align-items:center;gap:16px}.modal button{min-height:48px;border-radius:999px;border:1px solid #ffffff30;background:#20130f;color:white;padding:0 20px;font-weight:750;cursor:pointer}.modal .primary{background:#e31837;border-color:#e31837}.qty button{width:46px;padding:0}.close{float:right}.cartList{display:grid;gap:10px;margin:16px 0}.cartItem{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff1f;padding-bottom:10px}.total{font-size:22px;font-weight:800}
.imageViewer{position:fixed;inset:0;background:#080302;z-index:60;display:none;place-items:center;padding:1vw;cursor:zoom-out}.imageViewer.open{display:grid}.imageViewer img{width:98vw;height:96vh;object-fit:contain;filter:drop-shadow(0 34px 50px #000)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#15100d;padding:11px 17px;border-radius:999px;z-index:70;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.scene{padding:16px 10px 25px}.brand{left:12px;top:16px}.card{top:6%;right:3%;width:175px}.card h1{font-size:20px}.cartBtn{top:11px;right:10px}.stage{min-height:61vh;padding-top:15px}.card{top:2%}.card h1{font-size:25px}.food{width:100vw;height:54vh;margin-top:38px}.controls{gap:22px;margin-top:-10px}.controls button{width:64px;height:64px}.orderAction{margin-top:14px}.notice{max-width:88%;line-height:1.3}}
</style></head>
<body>
<main class="scene">
<button class="cartBtn" id="cartBtn">ORDER · <span id="count">0</span></button>
<div class="brand"><b>PIZZA <span>HUT</span></b><small>INTERACTIVE TABLE · CONCEPT</small></div>

<section class="stage">
<article class="card"><div class="eyebrow" id="cat"></div><h1 id="name"></h1><div class="desc" id="desc"></div><div class="price" id="price"></div></article>
<div class="food" id="food" role="button" tabindex="0" aria-label="Enlarge featured food"><img id="img" alt=""></div>
</section>
<nav class="controls" aria-label="Menu controls"><div class="controlUnit"><button id="prev" aria-label="Previous">◀</button>PREVIOUS</div><div class="controlUnit"><button id="play" class="primary" aria-label="Pause">Ⅱ</button><span id="playLabel">PAUSE</span></div><div class="controlUnit"><button id="next" aria-label="Next">▶</button>NEXT</div></nav><button class="orderAction" id="customize">CUSTOMIZE · ORDER</button>
<div class="dots" id="dots"></div>
<div class="notice">Unofficial interactive ordering concept · Demo only · Not affiliated with or operated by Pizza Hut.</div>
</main>
<div class="modalWrap" id="detail"><div class="modal"><button class="close" data-close="detail">✕</button><div class="eyebrow">CUSTOMIZE ORDER</div><h2 id="mName"></h2><p id="mDesc" class="desc"></p><strong>Size</strong><div class="row" id="sizes"></div><strong>Quantity</strong><div class="qty"><button id="minus">−</button><b id="qty">1</b><button id="plus">+</button></div><div class="row"><button class="primary" id="add">ADD TO ORDER</button><button data-close="detail">CANCEL</button></div></div></div>
<div class="modalWrap" id="cart"><div class="modal"><button class="close" data-close="cart">✕</button><div class="eyebrow">YOUR TABLE ORDER</div><h2>Order Summary</h2><div class="cartList" id="cartList"></div><div class="total" id="total"></div><div class="row"><button class="primary" id="checkout">DEMO CHECKOUT</button><button data-close="cart">CONTINUE BROWSING</button></div></div></div>
<div class="imageViewer" id="imageViewer" role="dialog" aria-modal="true" aria-label="Enlarged food image"><img id="bigImg" alt=""></div><div class="toast" id="toast"></div>
<script>
const items=[
{name:"Pepperoni Supreme",cat:"PIZZA",price:549,desc:"A loaded pepperoni pizza concept with melted cheese and a crisp golden crust.",img:"https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Large","Family"]},
{name:"Cheese Lovers",cat:"PIZZA",price:499,desc:"Rich, melty cheese over a classic tomato base for a simple crowd favorite.",img:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Large","Family"]},
{name:"Creamy Pasta",cat:"PASTA",price:229,desc:"Comforting creamy pasta served warm for the table.",img:"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=85",sizes:["Solo","Sharing"]},
{name:"Crispy Chicken",cat:"CHICKEN",price:349,desc:"Crispy, savory chicken made for sharing alongside pizza.",img:"https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&w=900&q=85",sizes:["4 pcs","6 pcs","8 pcs"]},
{name:"Garlic Bread",cat:"SIDES",price:169,desc:"Toasty garlic bread with a buttery finish.",img:"https://images.unsplash.com/photo-1573140401552-3fab0b24306f?auto=format&fit=crop&w=900&q=85",sizes:["Regular","Sharing"]},
{name:"Chocolate Dessert",cat:"DESSERT",price:199,desc:"A rich chocolate finish to your table order.",img:"https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=900&q=85",sizes:["Solo","Sharing"]}
];
let i=0,playing=true,timer,qty=1,size="",cart=[];
const $=id=>document.getElementById(id);
function render(){
 const x=items[i]; $("name").textContent=x.name;$("cat").textContent=x.cat+" · FEATURED";$("desc").textContent=x.desc;$("price").textContent="₱"+x.price.toLocaleString();$("img").src=x.img;$("img").alt=x.name;
 $("dots").innerHTML=items.map((_,n)=>'<span class="dot '+(n===i?'on':'')+'"></span>').join("");
}
function move(d){$("food").classList.add("swap");setTimeout(()=>{i=(i+d+items.length)%items.length;render();$("food").classList.remove("swap")},220)}
function restart(){clearInterval(timer);if(playing)timer=setInterval(()=>move(1),4500)}
$("prev").onclick=()=>{move(-1);restart()};$("next").onclick=()=>{move(1);restart()};
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Ⅱ":"▶";$("playLabel").textContent=playing?"PAUSE":"PLAY";restart()};
function openImage(){const x=items[i];$("bigImg").src=x.img;$("bigImg").alt=x.name;$("imageViewer").classList.add("open");clearInterval(timer)}
$("imageViewer").onclick=()=>{$("imageViewer").classList.remove("open");restart()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("imageViewer").classList.contains("open")){$("imageViewer").classList.remove("open");restart()}});
$("customize").onclick=openDetail;
function openDetail(){const x=items[i];qty=1;size=x.sizes[0];$("mName").textContent=x.name;$("mDesc").textContent=x.desc;$("qty").textContent=qty;$("sizes").innerHTML=x.sizes.map((s,n)=>'<span class="choice '+(!n?'selected':'')+'" data-size="'+s+'">'+s+'</span>').join("");$("detail").classList.add("open")}
$("food").onclick=e=>{e.stopPropagation();openImage()};$("food").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();openImage()}};
$("sizes").onclick=e=>{if(!e.target.dataset.size)return;size=e.target.dataset.size;[...$("sizes").children].forEach(x=>x.classList.toggle("selected",x===e.target))};
$("minus").onclick=()=>{$("qty").textContent=qty=Math.max(1,qty-1)};$("plus").onclick=()=>{$("qty").textContent=qty=Math.min(20,qty+1)};
$("add").onclick=()=>{cart.push({...items[i],qty,size});$("count").textContent=cart.reduce((a,x)=>a+x.qty,0);$("detail").classList.remove("open");toast("Added to your table order");renderCart()};
function renderCart(){if(!cart.length){$("cartList").innerHTML='<p class="desc">Your order is empty.</p>';$("total").textContent="Total · ₱0";return} $("cartList").innerHTML=cart.map(x=>'<div class="cartItem"><span>'+x.qty+'× '+x.name+'<br><small>'+x.size+'</small></span><b>₱'+(x.price*x.qty).toLocaleString()+'</b></div>').join("");$("total").textContent="Total · ₱"+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString()}
$("cartBtn").onclick=()=>{renderCart();$("cart").classList.add("open")};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("open"));
$("checkout").onclick=()=>{if(!cart.length){toast("Add an item first");return}cart=[];$("count").textContent="0";$("cart").classList.remove("open");toast("Demo order complete — thank you!")};
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
render();restart();
</script></body></html>
